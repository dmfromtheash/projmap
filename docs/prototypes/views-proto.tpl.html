<title>projmap: виды проекта</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
/* Layout: full-height app — slim top bar with variant tabs, a floating feature panel, the picture fills the rest.
   Labels are drawn only where they have room; details live in one tooltip and one info card. */
:root{
  color-scheme:dark;
  --bg:#0d1017; --bg2:#121722; --panel:#161c28cc; --solid:#171d29; --line:#2a3242; --fg:#eef1f7; --muted:#9aa3b5; --dim:#5f687a; --accent:#8fb0ff;
  --t-ui:#5aa7ff; --t-app:#f0a04b; --t-domain:#47c98a; --t-data:#d872c8; --t-infra:#d8c55a;
  --sans:"Golos Text","Segoe UI",system-ui,sans-serif; --mono:"JetBrains Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--fg);font:15px/1.45 var(--sans);background:radial-gradient(1200px 700px at 70% 10%,#18213a 0%,transparent 60%),radial-gradient(900px 600px at 10% 90%,#1a1530 0%,transparent 55%),var(--bg);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid #ffffff10;background:#0d1017aa;backdrop-filter:blur(8px)}
.brand b{font-size:18px;letter-spacing:-.01em}.brand span{display:block;color:var(--muted);font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:2px;padding:4px;border-radius:12px;background:#ffffff08;border:1px solid #ffffff12}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:9px;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected=true]{background:#ffffff14;color:var(--fg)}
.tabs .sep{width:1px;background:#ffffff1a;margin:6px 6px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;min-height:0}
.canvas{position:absolute;inset:0}
.canvas svg,.canvas canvas{display:block;width:100%;height:100%}
.float{position:absolute;z-index:3;padding:14px 16px;border-radius:16px;background:var(--panel);border:1px solid #ffffff14;backdrop-filter:blur(14px);box-shadow:0 10px 40px #0006}
.legendbox{left:max(16px,env(safe-area-inset-left,0px));top:16px;width:236px;max-height:calc(100% - 32px);overflow:auto}
.legendbox h3,.info h3{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.chip{all:unset;cursor:pointer;display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:9px;font-size:14px}
.chip:hover{background:#ffffff0d}.chip[aria-pressed=true]{background:#ffffff16}
.chip i{width:10px;height:10px;border-radius:50%}.chip small{color:var(--dim);font:12px var(--mono)}
.tiers{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}.tiers i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.info{right:max(16px,env(safe-area-inset-right,0px));top:16px;width:300px}
.info h2{margin:0 0 4px;font-size:19px;letter-spacing:-.01em}.info p{margin:0;color:var(--muted);font-size:13px}
.tip{position:fixed;z-index:9;pointer-events:none;padding:8px 11px;border-radius:10px;background:#0b0e15f0;border:1px solid #ffffff1f;font-size:13px;max-width:320px;opacity:0;transition:opacity .1s}
.tip b{display:block}.tip span{color:var(--muted);font:12px var(--mono)}
.page{position:absolute;inset:0;overflow:auto;padding:24px 340px 32px 276px}
.page h2{margin:0 0 6px;font-size:22px}.page p.lead{margin:0 0 18px;color:var(--muted);max-width:70ch}
/* time */
.weeks{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(180px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.week{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--solid);border:1px solid var(--line);min-width:0}
.week.gap{opacity:.55;border-style:dashed}.week h4{margin:0;font-size:14px}.week .total{font:600 26px var(--mono)}.week .total small{font:400 12px var(--sans);color:var(--muted);margin-left:6px}
.vstack{display:flex;flex-direction:column-reverse;border-radius:8px;overflow:hidden;background:#ffffff08}.vstack>i{display:block;width:100%;border-top:1px solid var(--solid)}
.wlist{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.wlist>span{display:flex;justify-content:space-between;gap:8px}.wlist b{color:var(--fg);font-weight:500}.wlist em{font-style:normal;font-family:var(--mono)}
.stages{display:flex;flex-wrap:wrap;gap:5px}.stages span{font:500 11px var(--mono);padding:2px 7px;border-radius:999px;background:#8fb0ff22;color:#cfdcff}
/* path */
.pathwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px}
.btns{display:flex;flex-direction:column;gap:8px}.btns button{all:unset;cursor:pointer;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--solid)}.btns button[aria-pressed=true]{border-color:var(--accent);background:#8fb0ff1c}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.lane-h{padding:8px;border-radius:10px;font-weight:600;font-size:13px;text-align:center;background:color-mix(in srgb,var(--c) 22%,transparent)}
.step{grid-column:var(--col);padding:11px 12px;border-radius:12px;background:var(--solid);border:1px solid var(--c);min-width:0}
.step b{display:block;overflow-wrap:anywhere}.step small{display:block;color:var(--muted);font:12px var(--mono);word-break:break-word;margin-top:3px}.step .k{font-size:11px;color:var(--dim)}.step .from{display:block;font-size:11px;color:var(--muted);margin-top:6px}
@media (max-width:900px){body{overflow:auto}.app{height:auto}.stage{height:auto}.canvas{position:relative;height:80vh}.float{position:relative;inset:auto;width:auto;margin:12px 16px}.page{position:relative;padding:16px}.pathwrap{grid-template-columns:1fr}.lanes{grid-template-columns:1fr}.lane-h{display:none}.step{grid-column:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
<header>
  <div class="brand"><b>Map</b><span>473 файла · 9 функций · 5 ярусов</span></div>
  <nav class="tabs" role="tablist" aria-label="Вид">
    <button role="tab" data-v="0">Схема связей</button>
    <button role="tab" data-v="1">Созвездие</button>
    <button role="tab" data-v="2">Плитки</button>
    <button role="tab" data-v="3">Дерево</button>
    <button role="tab" data-v="4">Солнце</button>
    <button role="tab" data-v="5">Потоки</button>
    <span class="sep" aria-hidden="true"></span>
    <button role="tab" data-v="6">Время</button>
    <button role="tab" data-v="7">От кнопки</button>
  </nav>
</header>
<div class="stage">
  <div class="canvas" id="canvas"></div>
  <div class="page" id="page" hidden></div>
  <div class="float legendbox"><h3>Функции</h3><div class="chips" id="chips"></div><h3>Ярусы</h3><div class="tiers" id="tiers"></div></div>
  <div class="float info" id="info"></div>
</div>
</div>
<div class="tip" id="tip"></div>

<script>
const D = __DATA__;
const TIERS=[{id:'ui',name:'Интерфейс',sub:'окна, панели, кнопки'},{id:'app',name:'Сценарии',sub:'экспорт, операции'},{id:'domain',name:'Ядро',sub:'документ карты, правила'},{id:'data',name:'Данные',sub:'сохранение, каталог'},{id:'infra',name:'Движок',sub:'отрисовка, Windows'}];
const TC={ui:'#5aa7ff',app:'#f0a04b',domain:'#47c98a',data:'#d872c8',infra:'#d8c55a'};
const FEATS=[...D.features,{id:'other',name:'Общий код'}];
const FC={export:'#8fb0ff',hex:'#ffab6b',light:'#ffd86b',save:'#e08ae4',atlas:'#6fe0d0',roads:'#d7aa78',rivers:'#62c3ff',assets:'#a5e06e',style:'#ff8fae',other:'#59627a'};
const fname=id=>FEATS.find(f=>f.id===id)?.name||id, tname=id=>TIERS.find(t=>t.id===id)?.name||id;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;return n>10&&n<20?c:m===1?a:m>=2&&m<=4?b:c;};
const files=D.files; const nF=f=>files.filter(x=>x.f===f).length;
let sel=null, view='0';
const tip=document.getElementById('tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;const x=Math.min(e.clientX+14,innerWidth-340),y=Math.min(e.clientY+14,innerHeight-80);tip.style.left=x+'px';tip.style.top=y+'px';}
function hideTip(){tip.style.opacity=0;}
const fileTip=f=>`<b>${esc(f.n)}</b><span>${tname(f.t)} · ${fname(f.f)}<br>${f.m} функций · ${f.c} изм. с августа</span>`;
const chips=document.getElementById('chips');
chips.innerHTML=FEATS.map(f=>`<button class="chip" data-id="${f.id}" aria-pressed="false"><i style="background:${FC[f.id]}"></i><span>${esc(f.name)}</span><small>${nF(f.id)}</small></button>`).join('');
chips.onclick=e=>{const b=e.target.closest('.chip');if(b){sel=sel===b.dataset.id?null:b.dataset.id;draw();}};
document.getElementById('tiers').innerHTML=TIERS.map(t=>`<span><i style="background:${TC[t.id]}"></i>${t.name} <span style="color:var(--dim)">— ${t.sub}</span></span>`).join('');
const info=document.getElementById('info');
function setInfo(title,text){info.innerHTML=`<h3>${title}</h3>${text}`;}
const canvas=document.getElementById('canvas'), page=document.getElementById('page');
const size=()=>({W:canvas.clientWidth,H:canvas.clientHeight});

// 0 · scheme: architecture diagram — tier bands, a block per feature in each tier (same feature = same column),
// arrows = calls between blocks (width ~ calls). Hover a block: its links light up; click: details on the right. Wheel zoom.
let cellSel=null;
function v0(){
  const {W,H}=size();
  const cols=FEATS.filter(f=>files.some(x=>x.f===f.id)); const bw=150, bh=62, cg=14, band=150, padL=166, padT=20;
  const key=(t,f)=>t+'|'+f; const cells=[];
  TIERS.forEach((t,r)=>cols.forEach((f,c)=>{ const n=files.filter(x=>x.t===t.id&&x.f===f.id).length; if(n) cells.push({k:key(t.id,f.id),t,f,n,x:padL+c*(bw+cg),y:padT+r*band+(band-bh)/2}); }));
  const byK=new Map(cells.map(c=>[c.k,c]));
  const fullW=padL+cols.length*(bw+cg), fullH=padT+TIERS.length*band+20;
  const svg=d3.select(canvas).append('svg').attr('viewBox',`0 0 ${W} ${H}`); const z=svg.append('g');
  const avail=W-276-330, k0=Math.min(1.3,avail/fullW,(H-30)/fullH);
  const zoom=d3.zoom().scaleExtent([.4,4]).on('zoom',e=>z.attr('transform',e.transform)); svg.call(zoom).on('dblclick.zoom',null);
  svg.call(zoom.transform,d3.zoomIdentity.translate(276+(avail-fullW*k0)/2,(H-fullH*k0)/2).scale(k0));
  const defs=svg.append('defs');
  defs.append('marker').attr('id','ah').attr('viewBox','0 0 10 10').attr('refX',8).attr('refY',5).attr('markerUnits','userSpaceOnUse').attr('markerWidth',11).attr('markerHeight',11).attr('orient','auto-start-reverse').append('path').attr('d','M0,0 L10,5 L0,10 z').attr('fill','context-stroke');
  // bands
  TIERS.forEach((t,r)=>{ z.append('rect').attr('x',0).attr('y',padT+r*band+4).attr('width',fullW).attr('height',band-8).attr('rx',14).attr('fill',TC[t.id]).attr('fill-opacity',.06).attr('stroke',TC[t.id]).attr('stroke-opacity',.25);
    z.append('text').attr('x',16).attr('y',padT+r*band+band/2-4).attr('fill',TC[t.id]).attr('font-weight',700).attr('font-size',16).text(t.name);
    z.append('text').attr('x',16).attr('y',padT+r*band+band/2+15).attr('fill','#9aa3b5').attr('font-size',11).text(t.sub); });
  const links=D.cellLinks.map(([a,b,n])=>({a:byK.get(a),b:byK.get(b),n})).filter(l=>l.a&&l.b);
  const maxN=d3.max(links,l=>l.n);
  const focus=cellSel||null;
  const shown=links.filter(l=>focus?(l.a.k===focus||l.b.k===focus):true).slice(0,focus?999:45);
  const pathOf=l=>{ const a=l.a,b=l.b; const ax=a.x+bw/2, bx=b.x+bw/2;
    if(a.y===b.y){ const y=a.y+bh, dy=34+Math.abs(ax-bx)*.12; return `M${ax},${y} C${ax},${y+dy} ${bx},${y+dy} ${bx},${y+2}`; }
    const down=b.y>a.y; const ay=down?a.y+bh:a.y, by=down?b.y-2:b.y+bh+2; const m=(ay+by)/2; return `M${ax},${ay} C${ax},${m} ${bx},${m} ${bx},${by}`; };
  const lg=z.append('g').attr('fill','none');
  const lp=lg.selectAll('path').data(shown).join('path').attr('d',pathOf)
    .attr('stroke',l=>focus?(l.a.k===focus?FC[l.b.f.id]:FC[l.a.f.id]):'#8a93a8').attr('stroke-opacity',focus?.85:.28)
    .attr('stroke-width',l=>1+7*Math.sqrt(l.n/maxN)).attr('marker-end','url(#ah)')
    .on('mousemove',(e,l)=>showTip(e,`<b>${tname(l.a.t.id)} · ${esc(fname(l.a.f.id))} → ${tname(l.b.t.id)} · ${esc(fname(l.b.f.id))}</b><span>${l.n} вызовов</span>`)).on('mouseleave',hideTip);
  const bg=z.append('g');
  const box=bg.selectAll('g').data(cells).join('g').attr('transform',c=>`translate(${c.x},${c.y})`).style('cursor','pointer')
    .attr('opacity',c=>{ if(sel&&c.f.id!==sel) return .25; if(!focus) return 1; return c.k===focus||shown.some(l=>l.a===c||l.b===c)?1:.25; })
    .on('click',(e,c)=>{ cellSel=cellSel===c.k?null:c.k; draw(); e.stopPropagation(); })
    .on('mouseenter',(e,c)=>{ if(focus) return; lp.attr('stroke-opacity',l=>l.a===c||l.b===c?.9:.06).attr('stroke',l=>l.a===c?FC[l.b.f.id]:l.b===c?FC[l.a.f.id]:'#8a93a8'); })
    .on('mouseleave',()=>{ if(focus) return; lp.attr('stroke-opacity',.28).attr('stroke','#8a93a8'); });
  box.append('rect').attr('width',bw).attr('height',bh).attr('rx',11).attr('fill','#161c28').attr('stroke',c=>FC[c.f.id]).attr('stroke-width',c=>c.k===focus?3:1.5);
  box.append('rect').attr('width',5).attr('height',bh-16).attr('x',8).attr('y',8).attr('rx',2).attr('fill',c=>FC[c.f.id]);
  box.append('text').attr('x',20).attr('y',24).attr('fill','#eef1f7').attr('font-weight',600).attr('font-size',14).text(c=>c.f.name.length>16?c.f.name.slice(0,15)+'…':c.f.name);
  box.append('text').attr('x',20).attr('y',43).attr('fill','#9aa3b5').attr('font-size',12).attr('font-family','JetBrains Mono').text(c=>`${c.n} ${plural(c.n,'файл','файла','файлов')}`);
  svg.on('click',()=>{ if(cellSel){ cellSel=null; draw(); } });
  if(!focus){ setInfo('Схема связей', `<h2>Вся программа и её связи</h2><p>Полосы — ярусы, блоки — функции на этом ярусе (одна функция — одна колонка). Стрелка — код одного блока вызывает код другого, толщина — сколько вызовов. Показаны 45 самых сильных. Наведите на блок — увидите его связи; нажмите — подробности. Колесо — приближение.</p>`); return; }
  const c=byK.get(focus); const out=links.filter(l=>l.a===c).sort((x,y)=>y.n-x.n), inn=links.filter(l=>l.b===c).sort((x,y)=>y.n-x.n);
  const li=(l,o)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid #ffffff10;font-size:13px"><span><span style="color:${FC[o.f.id]}">●</span> ${tname(o.t.id)} · ${esc(fname(o.f.id))}</span><span style="font-family:var(--mono);color:var(--muted)">${l.n}</span></div>`;
  setInfo('Блок', `<h2 style="color:${FC[c.f.id]}">${esc(fname(c.f.id))}</h2><p>${tname(c.t.id)} · ${c.n} ${plural(c.n,'файл','файла','файлов')}</p>
    <p style="margin-top:10px;color:var(--fg)">Главные файлы</p><p style="font-family:var(--mono);font-size:12px">${(D.cellTop[c.k]||[]).map(esc).join('<br>')}</p>
    <p style="margin-top:10px;color:var(--fg)">Вызывает →</p>${out.slice(0,6).map(l=>li(l,l.b)).join('')||'<p>—</p>'}
    <p style="margin-top:10px;color:var(--fg)">← Его вызывают</p>${inn.slice(0,6).map(l=>li(l,l.a)).join('')||'<p>—</p>'}
    <p style="margin-top:10px">Нажмите на пустое место, чтобы вернуться ко всей схеме.</p>`);
}

// 1 · constellation: hierarchical edge bundling (feature arcs around the circle, bundled call links)
function v1(){
  const {W,H}=size(); const R=Math.min(W-560,H)/2-100; const cx=276+(W-276-320)/2, cy=H/2;
  const CF=FEATS.filter(f=>f.id!=='other'); const root=d3.hierarchy({children:CF.map(f=>({id:f.id,children:files.map((x,i)=>({...x,i})).filter(x=>x.f===f.id).sort((a,b)=>a.t.localeCompare(b.t))}))}).sum(()=>1);
  d3.cluster().size([2*Math.PI,R])(root);
  const leaves=root.leaves(); const byI=new Map(leaves.map(l=>[l.data.i,l]));
  const svg=d3.select(canvas).append('svg').attr('viewBox',`0 0 ${W} ${H}`); const zr=svg.append('g'); svg.call(d3.zoom().scaleExtent([.6,6]).on('zoom',e=>zr.attr('transform',e.transform)));
  const g=zr.append('g').attr('transform',`translate(${cx},${cy})`);
  const line=d3.lineRadial().curve(d3.curveBundle.beta(.85)).radius(d=>d.y).angle(d=>d.x);
  const maxN=d3.max(D.flinks,l=>l[2]);
  const links=D.flinks.map(([a,b,n])=>({s:byI.get(a),t:byI.get(b),n})).filter(l=>l.s&&l.t).slice(0,260);
  const on=l=>!sel||l.s.data.f===sel||l.t.data.f===sel;
  g.append('g').attr('fill','none').selectAll('path').data(links.sort((a,b)=>on(a)-on(b))).join('path')
    .attr('d',l=>line(l.s.path(l.t))).attr('stroke',l=>on(l)&&sel?FC[sel]:FC[l.s.data.f])
    .attr('stroke-opacity',l=>on(l)?(sel?.85:.32):.04).attr('stroke-width',l=>.6+2.2*Math.sqrt(l.n/maxN));
  g.append('g').selectAll('circle').data(leaves).join('circle')
    .attr('transform',d=>`rotate(${d.x*180/Math.PI-90}) translate(${d.y},0)`).attr('r',d=>1.6+Math.sqrt(d.data.m)/2.2)
    .attr('fill',d=>TC[d.data.t]).attr('opacity',d=>!sel||d.data.f===sel?.95:.25)
    .on('mousemove',(e,d)=>showTip(e,fileTip(d.data))).on('mouseleave',hideTip);
  const arc=d3.arc().innerRadius(R+16).outerRadius(R+22).cornerRadius(3);
  root.children.forEach(c=>{ const a0=d3.min(c.leaves(),l=>l.x)-.012, a1=d3.max(c.leaves(),l=>l.x)+.012;
    g.append('path').attr('d',arc({startAngle:a0,endAngle:a1})).attr('fill',FC[c.data.id]).attr('opacity',!sel||sel===c.data.id?1:.3).style('cursor','pointer').on('click',()=>{sel=sel===c.data.id?null:c.data.id;draw();});
    const mid=(a0+a1)/2, deg=mid*180/Math.PI-90, flip=mid>Math.PI;
    g.append('text').attr('transform',`rotate(${deg}) translate(${R+32},0) ${flip?'rotate(180)':''}`).attr('text-anchor',flip?'end':'start').attr('dy','.35em')
      .attr('fill',!sel||sel===c.data.id?'#eef1f7':'#5f687a').attr('font-size',13).attr('font-weight',600).text(fname(c.data.id)); });
  const mine=links.filter(l=>sel&&on(l));
  setInfo('Созвездие', sel?`<h2 style="color:${FC[sel]}">${esc(fname(sel))}</h2><p>${mine.length} сильных связей с другими функциями. Точки — файлы (цвет — ярус), нити — вызовы кода между функциями, связанные в пучки.</p>`
    :`<h2>Кто с кем связан</h2><p>По кругу — файлы девяти функций (общий код не показан). Нити — вызовы между разными функциями; чем ярче пучок, тем теснее связь. Наведите на точку или нажмите на функцию. Колесо мыши — приближение.</p>`);
}

// 2 · tiles: zoomable treemap tier > feature > file; click a tile to open it, breadcrumbs to go back
let tileFocus=[];
function v2(){
  const {W,H}=size(); const x0=276, y0=58, w=W-276-336, h=H-80;
  const data={name:'Map',children:TIERS.map(t=>({name:t.name,tier:t.id,children:FEATS.map(f=>({name:f.name,f:f.id,tier:t.id,children:files.filter(x=>x.t===t.id&&x.f===f.id).map(x=>({...x,name:x.n,value:Math.max(30,x.loc)}))})).filter(f=>f.children.length)}))};
  const root=d3.hierarchy(data).sum(d=>d.value||0).sort((a,b)=>b.value-a.value);
  let node=root; for(const name of tileFocus){ const c=(node.children||[]).find(c=>c.data.name===name); if(!c) break; node=c; }
  const sub=d3.hierarchy(node.data).sum(d=>d.value||0).sort((a,b)=>b.value-a.value);
  d3.treemap().size([w,h]).paddingOuter(6).paddingTop(d=>d.depth===0?0:26).paddingInner(4).round(true)(sub);
  const svg=d3.select(canvas).append('svg').attr('viewBox',`0 0 ${W} ${H}`);
  const crumbs=['Map',...tileFocus];
  const bc=svg.append('g').attr('transform',`translate(${x0},${y0-24})`); let cx=0;
  crumbs.forEach((c,i)=>{ const last=i===crumbs.length-1; const t=bc.append('text').attr('x',cx).attr('y',0).attr('fill',last?'#eef1f7':'#8fb0ff').attr('font-size',14).attr('font-weight',last?600:500).style('cursor',last?'default':'pointer').text(c);
    if(!last) t.on('click',()=>{ tileFocus=tileFocus.slice(0,i); draw(); });
    cx+=t.node().getComputedTextLength()+8; if(!last){ bc.append('text').attr('x',cx).attr('fill','#5f687a').attr('font-size',14).text('›'); cx+=16; } });
  const g=svg.append('g').attr('transform',`translate(${x0},${y0})`);
  const colorOf=d=>d.data.f?FC[d.data.f]:d.data.tier?TC[d.data.tier]:'#59627a';
  const nodes=sub.descendants().filter(d=>d.depth>0&&d.depth<=2);
  const cell=g.selectAll('g').data(nodes).join('g').attr('transform',d=>`translate(${d.x0},${d.y0})`);
  cell.append('rect').attr('width',d=>Math.max(0,d.x1-d.x0)).attr('height',d=>Math.max(0,d.y1-d.y0)).attr('rx',d=>d.depth===1?10:6)
    .attr('fill',d=>d.depth===1?colorOf(d)+'1f':colorOf(d)+(d.children?'33':'cc')).attr('stroke',d=>colorOf(d)+(d.depth===1?'aa':'66'))
    .attr('opacity',d=>!sel||!d.data.f&&!(d.data.children||[]).length||d.data.f===sel||d.depth===1&&!d.data.f?1:.22)
    .style('cursor',d=>d.children?'zoom-in':'default')
    .on('click',(e,d)=>{ if(!d.children) return; const path=d.ancestors().reverse().slice(1).map(a=>a.data.name); tileFocus=[...tileFocus,...path]; draw(); })
    .on('mousemove',(e,d)=>showTip(e,d.data.p?fileTip(d.data):`<b>${esc(d.data.name)}</b><span>${d.leaves().length} ${plural(d.leaves().length,'файл','файла','файлов')} · нажмите, чтобы открыть</span>`)).on('mouseleave',hideTip);
  cell.each(function(d){ const ww=d.x1-d.x0, hh=d.y1-d.y0; const s=d3.select(this); const big=d.children||d.depth===1;
    const label=d.data.name, sub2=d.data.p?`${d.data.m} функций`:`${d.leaves().length} ${plural(d.leaves().length,'файл','файла','файлов')}`;
    const fs=d.depth===1?15:13; if(ww<label.length*fs*.55+16||hh<(big?24:34)) return;
    const nm=s.append('text').attr('x',10).attr('y',big?18:20).attr('fill','#eef1f7').attr('font-weight',600).attr('font-size',fs).attr('pointer-events','none').text(label);
    const nw=nm.node().getComputedTextLength(); if(nw>ww-16){ nm.remove(); return; }
    const ct=s.append('text').attr('x',ww-10).attr('y',big?18:20).attr('text-anchor','end').attr('fill','#c9d0de').attr('opacity',.75).attr('font-size',12).attr('font-family','JetBrains Mono').attr('pointer-events','none').text(sub2);
    if(nw+ct.node().getComputedTextLength()+28>ww){ ct.attr('x',10).attr('y',(big?18:20)+17).attr('text-anchor','start'); if(hh<(big?44:52)||ct.node().getComputedTextLength()>ww-16) ct.remove(); } });
  setInfo('Плитки', `<h2>${esc(crumbs[crumbs.length-1])}</h2><p>Площадь плитки — объём кода. ${node===root?'Большие рамки — ярусы, внутри — функции.':node.depth===1?'Внутри — функции этого яруса и их файлы.':'Внутри — файлы.'} Нажмите на плитку, чтобы открыть её; путь сверху — шаг назад.</p>`);
}

// 3 · tree: collapsible tree Map > tier > feature > file, wheel to zoom, drag to pan
const openTree=new Set(['Map','ui','app','domain','data','infra']);
function v3(){
  const {W,H}=size();
  const data={name:'Map',key:'Map',children:TIERS.map(t=>({name:t.name,key:t.id,tier:t.id,children:FEATS.map(f=>({name:f.name,key:t.id+'/'+f.id,f:f.id,tier:t.id,children:files.filter(x=>x.t===t.id&&x.f===f.id).sort((a,b)=>b.m-a.m).map(x=>({...x,name:x.n,key:x.p}))})).filter(f=>f.children.length)}))};
  const root=d3.hierarchy(data); root.each(d=>{ d.total=d.leaves().length; if(d.children&&!openTree.has(d.data.key)){ d._c=d.children; d.children=null; } });
  const dx=34, dy=330; d3.tree().nodeSize([dx,dy])(root);
  const svg=d3.select(canvas).append('svg').attr('viewBox',`0 0 ${W} ${H}`); const z=svg.append('g'); const g=z.append('g');
  let minX=Infinity,maxX=-Infinity; root.each(d=>{minX=Math.min(minX,d.x);maxX=Math.max(maxX,d.x);});
  const startY=(H-(maxX-minX))/2-minX;
  const zoom=d3.zoom().scaleExtent([.25,4]).on('zoom',e=>z.attr('transform',e.transform)); svg.call(zoom).on('dblclick.zoom',null);
  const k=1.05; svg.call(zoom.transform,d3.zoomIdentity.translate(330,H/2).scale(k));
  const col=d=>d.data.p?FC[d.data.f]:d.data.f?FC[d.data.f]:d.data.tier?TC[d.data.tier]:'#eef1f7';
  g.append('g').attr('fill','none').selectAll('path').data(root.links()).join('path')
    .attr('d',d3.linkHorizontal().x(d=>d.y).y(d=>d.x)).attr('stroke',d=>col(d.target)).attr('stroke-opacity',d=>!sel||d.target.data.f===sel||!d.target.data.f?.45:.08).attr('stroke-width',1.5);
  const n=g.append('g').selectAll('g').data(root.descendants()).join('g').attr('transform',d=>`translate(${d.y},${d.x})`)
    .style('cursor',d=>(d.children||d._c)?'pointer':'default').attr('opacity',d=>!sel||!d.data.f||d.data.f===sel?1:.25)
    .on('click',(e,d)=>{ if(!(d.children||d._c)) return; const k=d.data.key; openTree.has(k)?openTree.delete(k):openTree.add(k); draw(); })
    .on('mousemove',(e,d)=>d.data.p&&showTip(e,fileTip(d.data))).on('mouseleave',hideTip);
  n.append('circle').attr('r',d=>d.depth===0?9:d.data.p?3.5+Math.sqrt(d.data.m)/3:7).attr('fill',d=>d._c?col(d):'#0d1017').attr('stroke',col).attr('stroke-width',2);
  n.append('text').attr('x',d=>d.data.p?10:14).attr('dy','.35em').attr('fill','#eef1f7').attr('font-size',d=>d.data.p?12:14).attr('font-weight',d=>d.data.p?400:600)
    .attr('paint-order','stroke').attr('stroke','#0d1017').attr('stroke-width',4).text(d=>d.data.name);
  n.filter(d=>!d.data.p&&d.depth>0).append('text').attr('x',14).attr('dy','1.6em').attr('fill','#9aa3b5').attr('font-size',11).attr('font-family','JetBrains Mono')
    .text(d=>`${d.total} ${plural(d.total,'файл','файла','файлов')}${d._c?' · раскрыть':''}`);
  setInfo('Дерево', `<h2>Устройство по веткам</h2><p>Map → ярусы → функции → файлы. Нажмите на кружок, чтобы раскрыть или свернуть ветку. Колесо мыши — приближение, перетаскивание — сдвиг по дереву. Закрашенный кружок — внутри есть ещё.</p>`);
}

// 4 · sun: zoomable sunburst tier > feature > file
function v4(){
  const {W,H}=size(); const R=Math.min(W-620,H-40)/2; const cx=276+(W-276-320)/2, cy=H/2;
  const data={name:'Map',children:TIERS.map(t=>({name:t.name,tier:t.id,children:FEATS.map(f=>({name:f.name,f:f.id,tier:t.id,children:files.filter(x=>x.t===t.id&&x.f===f.id).map(x=>({...x,name:x.n,value:Math.max(20,x.loc)}))})).filter(f=>f.children.length)}))};
  const root=d3.partition().size([2*Math.PI,3])(d3.hierarchy(data).sum(d=>d.value||0).sort((a,b)=>b.value-a.value)); root.each(d=>d.current=d);
  const ring=R/3.2; const arc=d3.arc().startAngle(d=>d.x0).endAngle(d=>d.x1).padAngle(d=>Math.min((d.x1-d.x0)/2,.004)).padRadius(R).innerRadius(d=>d.y0*ring+ring*.55).outerRadius(d=>Math.max(d.y0*ring+ring*.55,d.y1*ring+ring*.55-2)).cornerRadius(2);
  const svg=d3.select(canvas).append('svg').attr('viewBox',`0 0 ${W} ${H}`); const g=svg.append('g').attr('transform',`translate(${cx},${cy})`);
  const col=d=>d.depth===1?TC[d.data.tier]:FC[d.data.f]; const vis=d=>d.y1<=3&&d.y0>=1&&d.x1>d.x0;
  const path=g.append('g').selectAll('path').data(root.descendants().slice(1)).join('path').attr('fill',col)
    .attr('fill-opacity',d=>vis(d.current)?(d.depth===3?.55:.9)*(!sel||d.depth===1||d.data.f===sel?1:.2):0).attr('d',d=>arc(d.current)).style('cursor',d=>d.children?'pointer':'default')
    .on('click',(e,d)=>d.children&&clicked(d)).on('mousemove',(e,d)=>showTip(e,d.depth===3?fileTip(d.data):`<b>${esc(d.data.name)}</b><span>${d.leaves().length} файлов</span>`)).on('mouseleave',hideTip);
  const lab=g.append('g').attr('pointer-events','none').attr('text-anchor','middle').selectAll('text').data(root.descendants().slice(1)).join('text').attr('dy','.35em').attr('fill','#0d1017').attr('font-weight',600).attr('font-size',12).text(d=>d.data.name);
  const center=g.append('circle').attr('r',ring*.5).attr('fill','#ffffff08').style('cursor','pointer').on('click',()=>clicked(focus.parent||root));
  const ctext=g.append('text').attr('text-anchor','middle').attr('fill','#eef1f7').attr('font-weight',600).attr('font-size',15).attr('dy','.35em');
  let focus=root;
  const labelOk=d=>{ const a=(d.x1-d.x0)*((d.y0+d.y1)/2*ring+ring*.55); return vis(d)&&d.y0<3&&a>d.data.name.length*7+8; };
  const labelT=d=>{ const x=(d.x0+d.x1)/2*180/Math.PI, y=(d.y0+d.y1)/2*ring+ring*.55; return `rotate(${x-90}) translate(${y},0) rotate(${x<180?0:180})`; };
  function update(){ lab.attr('opacity',d=>labelOk(d.current)?1:0).attr('transform',d=>labelT(d.current)); ctext.text(focus===root?'Map':focus.data.name); }
  function clicked(p){ focus=p; root.each(d=>d.target={x0:Math.max(0,Math.min(1,(d.x0-p.x0)/(p.x1-p.x0)))*2*Math.PI,x1:Math.max(0,Math.min(1,(d.x1-p.x0)/(p.x1-p.x0)))*2*Math.PI,y0:Math.max(0,d.y0-p.depth),y1:Math.max(0,d.y1-p.depth)});
    const t=svg.transition().duration(650);
    path.transition(t).tween('data',d=>{const i=d3.interpolate(d.current,d.target);return t=>d.current=i(t);}).attrTween('d',d=>()=>arc(d.current)).attr('fill-opacity',d=>vis(d.target)?(d.depth===3?.55:.9)*(!sel||d.depth===1||d.data.f===sel?1:.2):0);
    lab.transition(t).attrTween('transform',d=>()=>labelT(d.current)).attr('opacity',d=>labelOk(d.target)?1:0); ctext.text(p===root?'Map':p.data.name); }
  update();
  setInfo('Солнце', `<h2>Кольца программы</h2><p>Внутреннее кольцо — ярусы, среднее — функции, внешнее — файлы (ширина — объём кода). Нажмите на сектор — он раскроется на весь круг. Центр — шаг назад.</p>`);
}

// 5 · flows: ribbons tier -> feature, width = files
function v5(){
  const {W,H}=size(); const x0=276+60, x1=W-320-60-150, top=60, h=H-120, gap=14;
  const svg0=d3.select(canvas).append('svg').attr('viewBox',`0 0 ${W} ${H}`); const svg=svg0.append('g'); svg0.call(d3.zoom().scaleExtent([.6,6]).on('zoom',e=>svg.attr('transform',e.transform)));
  const flows=[]; TIERS.forEach(t=>FEATS.forEach(f=>{const n=files.filter(x=>x.t===t.id&&x.f===f.id).length; if(n) flows.push({t:t.id,f:f.id,n});}));
  const total=files.length, k=(h-gap*(FEATS.length-1))/total;
  const L={}, Rn={}; let y=top; TIERS.forEach(t=>{const n=files.filter(x=>x.t===t.id).length; L[t.id]={y,h:n*k,off:0,n}; y+=n*k+gap*(FEATS.length-1)/(TIERS.length-1);});
  y=top; FEATS.forEach(f=>{const n=nF(f.id); Rn[f.id]={y,h:n*k,off:0,n}; y+=n*k+gap;});
  const defs=svg0.append('defs');
  flows.sort((a,b)=>TIERS.findIndex(t=>t.id===a.t)-TIERS.findIndex(t=>t.id===b.t)||FEATS.findIndex(f=>f.id===a.f)-FEATS.findIndex(f=>f.id===b.f));
  flows.forEach((fl,i)=>{ const a=L[fl.t], b=Rn[fl.f]; const w=fl.n*k; const ya=a.y+a.off, yb=b.y+b.off; a.off+=w; b.off+=w;
    const gid='gr'+i; const gr=defs.append('linearGradient').attr('id',gid).attr('x1','0%').attr('x2','100%'); gr.append('stop').attr('offset','0%').attr('stop-color',TC[fl.t]); gr.append('stop').attr('offset','100%').attr('stop-color',FC[fl.f]);
    const xa=x0+14, xb=x1, xm=(xa+xb)/2;
    svg.append('path').attr('d',`M${xa},${ya} C${xm},${ya} ${xm},${yb} ${xb},${yb} L${xb},${yb+w} C${xm},${yb+w} ${xm},${ya+w} ${xa},${ya+w} Z`)
      .attr('fill',`url(#${gid})`).attr('opacity',!sel||sel===fl.f?.55:.07)
      .on('mousemove',e=>showTip(e,`<b>${tname(fl.t)} → ${esc(fname(fl.f))}</b><span>${fl.n} ${plural(fl.n,'файл','файла','файлов')}</span>`)).on('mouseleave',hideTip); });
  TIERS.forEach(t=>{ const a=L[t.id]; svg.append('rect').attr('x',x0).attr('y',a.y).attr('width',14).attr('height',Math.max(2,a.h)).attr('rx',4).attr('fill',TC[t.id]);
    svg.append('text').attr('x',x0-10).attr('y',a.y+a.h/2).attr('dy','.35em').attr('text-anchor','end').attr('fill','#eef1f7').attr('font-weight',600).attr('font-size',14).text(t.name);
    svg.append('text').attr('x',x0-10).attr('y',a.y+a.h/2+17).attr('text-anchor','end').attr('fill','#9aa3b5').attr('font-size',12).text(a.n+' '+plural(a.n,'файл','файла','файлов')); });
  FEATS.forEach(f=>{ const b=Rn[f.id]; svg.append('rect').attr('x',x1).attr('y',b.y).attr('width',10).attr('height',Math.max(2,b.h)).attr('rx',3).attr('fill',FC[f.id]);
    svg.append('text').attr('x',x1+18).attr('y',b.y+b.h/2).attr('dy','.35em').attr('fill',!sel||sel===f.id?'#eef1f7':'#5f687a').attr('font-weight',500).attr('font-size',13).style('cursor','pointer').text(`${fname(f.id)} · ${b.n}`).on('click',()=>{sel=sel===f.id?null:f.id;draw();}); });
  setInfo('Потоки', `<h2>Как ярусы питают функции</h2><p>Слева — ярусы, справа — функции. Лента показывает, сколько файлов яруса работает на функцию; её толщина — количество. Видно, какие функции держатся на интерфейсе, а какие — на ядре или движке. Колесо мыши — приближение.</p>`);
}

// 6 · time (weeks)
function v6(){
  page.hidden=false; const weeks=Object.keys(D.weekCommits); const fmt=w=>new Date(w).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}); const html=[];
  const maxSum=Math.max(...weeks.map(w=>Object.values(D.weeks[w]||{}).reduce((a,b)=>a+b,0)));
  weeks.forEach((w,i)=>{ if(i&&(new Date(w)-new Date(weeks[i-1]))>8*864e5) html.push(`<div class="week gap"><h4>${fmt(new Date(+new Date(weeks[i-1])+7*864e5))} – ${fmt(new Date(+new Date(w)-864e5))}</h4><span style="color:var(--muted);font-size:13px">Перерыв: сохранений кода не было ни в одной ветке.</span></div>`);
    const fs=D.weeks[w]||{}; const sum=Object.values(fs).reduce((a,b)=>a+b,0)||1; const st=D.stages.filter(s=>{const d=new Date(s.date),a=new Date(w);return d>=a&&d<new Date(+a+7*864e5);});
    const order=D.features.filter(f=>fs[f.id]).sort((a,b)=>fs[b.id]-fs[a.id]);
    html.push(`<div class="week"><h4>Неделя с ${fmt(w)}</h4><div class="total">${D.weekCommits[w]}<small>${plural(D.weekCommits[w],'сохранение','сохранения','сохранений')}</small></div>
      <div class="vstack" style="height:${Math.max(40,160*sum/maxSum)}px">${order.map(f=>`<i style="height:${100*fs[f.id]/sum}%;background:${!sel||sel===f.id?FC[f.id]:'#323a4a'}"></i>`).join('')}</div>
      <div class="wlist">${order.slice(0,5).map(f=>`<span style="opacity:${!sel||sel===f.id?1:.5}"><b><i style="color:${FC[f.id]};font-style:normal">●</i> ${esc(f.name)}</b><em>${fs[f.id]}</em></span>`).join('')}${order.length>5?`<span>…и ещё ${order.length-5}</span>`:''}</div>
      ${st.length?`<span style="font-size:12px;color:var(--muted)">Закрыто этапов: ${st.length}</span><div class="stages">${st.map(s=>`<span title="${esc(s.name)}">${s.key}</span>`).join('')}</div>`:''}</div>`); });
  page.innerHTML=`<h2>Лента времени</h2><p class="lead">Неделя за неделей: сколько было сохранений кода, какие функции менялись и какие этапы закрыты.</p><div class="weeks">${html.join('')}</div>`;
  setInfo('Время', `<h2>${D.stages.length} этапов дорожной карты</h2><p>Выберите функцию слева — в каждой неделе подсветится её доля.</p>`);
}
// 7 · from a button
let ci=0;
function v7(){
  page.hidden=false; const c=D.chains[ci].chain;
  const cells=TIERS.map(t=>`<div class="lane-h" style="--c:${TC[t.id]}">${t.name}</div>`);
  c.forEach((s,k)=>{ const col=TIERS.findIndex(t=>t.id===s.tier)+1; cells.push(`<div class="step" style="--col:${col};--c:${TC[s.tier]}"><span class="k">Шаг ${k+1}${k===0?' · кнопка':''}</span><b>${esc(k===0?s.name:(s.type+'.'+s.name))}</b><small>${esc(s.file)}${s.line?':'+s.line:''}</small>${k?`<span class="from">↑ из шага ${k}${c[k-1].tier!==s.tier?' · на ярус «'+tname(s.tier)+'»':''}</span>`:''}</div>`); });
  page.innerHTML=`<h2>От кнопки до кода</h2><p class="lead">Путь работы кнопки через ярусы — по связям кода (projmap), возможный путь, а не запись запуска.</p><div class="pathwrap"><div class="btns">${D.chains.map((x,i)=>`<button data-i="${i}" aria-pressed="${i===ci}">«${esc(x.label)}»</button>`).join('')}</div><div class="lanes">${cells.join('')}</div></div>`;
  page.querySelector('.btns').onclick=e=>{const b=e.target.closest('button');if(b){ci=+b.dataset.i;v7();}};
  setInfo('От кнопки', `<h2>«${esc(D.chains[ci].label)}»</h2><p>${c.length} ${plural(c.length,'шаг','шага','шагов')}, ${new Set(c.map(x=>x.tier)).size} ${plural(new Set(c.map(x=>x.tier)).size,'ярус','яруса','ярусов')}.</p>`);
}
const tabs=[...document.querySelectorAll('[role=tab]')];
tabs.forEach(t=>t.onclick=()=>{view=t.dataset.v;try{localStorage.setItem('pmv3',view)}catch(e){}draw();});
try{view=localStorage.getItem('pmv3')||'0'}catch(e){}
function draw(){ tabs.forEach(t=>t.setAttribute('aria-selected',t.dataset.v===view)); [...chips.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===sel));
  canvas.innerHTML=''; page.hidden=true; hideTip(); ({0:v0,1:v1,2:v2,3:v3,4:v4,5:v5,6:v6,7:v7})[view](); }
let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(draw,150);});
(document.fonts?document.fonts.ready:Promise.resolve()).then(draw);
</script>
